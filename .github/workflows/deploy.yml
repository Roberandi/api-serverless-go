name: CI/CD Serverless Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4 # <-- ACTUALIZADO de v3 a v4

    - name: 2. Configurar el entorno Go
      uses: actions/setup-go@v5 # <-- ACTUALIZADO de v4 a v5
      with:
        go-version: '1.21'

    - name: 3. Construir y Empaquetar Lambdas
      run: |
        # A. Compilar y empaquetar la Lambda Principal (API)
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o bootstrap cmd/api/main.go
        zip bootstrap.zip bootstrap
        rm bootstrap 
        
        # B. Compilar y empaquetar la Lambda de Notificaciones (El Cocinero)
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o bootstrap cmd/notification/main.go
        zip notification.zip bootstrap

    - name: 4. Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4 # <-- ACTUALIZADO de v2 a v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: 5. Instalar Terraform
      uses: hashicorp/setup-terraform@v3 # <-- ACTUALIZADO de v2 a v3

    - name: 6. Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: 7. Terraform Validate
      run: terraform validate
      working-directory: ./terraform

    - name: 8. Terraform Plan
      run: terraform plan
      working-directory: ./terraform
      env:
        TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
        TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
        TF_VAR_smtp_pass: ${{ secrets.SMTP_PASS }}

    - name: 9. Terraform Apply (Despliegue final)
      run: terraform apply -auto-approve
      working-directory: ./terraform
      env:
        TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
        TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
        TF_VAR_smtp_pass: ${{ secrets.SMTP_PASS }}